<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Fuel Drop Primary Gradient (Tech Teal to Cyan) -->
    <linearGradient id="dropGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0b3a7d"/>
    </linearGradient>

    <!-- Optimization Node/Graph Gradient (Dynamic Orange/Gold) -->
    <linearGradient id="optGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="50%" stop-color="#ffa500"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>

    <!-- Glow Filter for Dashboard Nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle Drop Shadow for Leaf/Nodes -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main Logo Mark Group (Transparent Background) -->
  <g>
    <!-- Outer Glow Ring (Admin/System Tracking Aesthetic) -->
    <circle cx="400" cy="400" r="280" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-dasharray="16 12" opacity="0.3" />
    <circle cx="400" cy="400" r="240" fill="none" stroke="url(#dropGrad)" stroke-width="2" opacity="0.2" />

    <!-- 1. The Core Fuel Droplet Structure -->
    <path d="M 400,180 
             C 400,180 560,360 560,480 
             A 160,160 0 0,1 240,480 
             C 240,360 400,180 400,180 Z" 
          fill="url(#dropGrad)" 
          filter="url(#shadow)" />

    <!-- Sleek Internal Reflection/Curve for Premium Tech Depth -->
    <path d="M 400,210 
             C 400,210 520,360 520,470
             A 120,120 0 0,1 320,470" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.25" />

    <!-- 2. The Smart Optimization System (Embedded Graph & Analytics) -->
    <!-- Connection Lines -->
    <path d="M 330,520 L 400,430 L 480,470" fill="none" stroke="url(#optGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M 400,430 L 450,340" fill="none" stroke="url(#optGrad)" stroke-width="6" stroke-dasharray="2 8" stroke-linecap="round" filter="url(#glow)" />

    <!-- Data Nodes (Admin Dashboard Style) -->
    <!-- Node 1: Low Point -->
    <circle cx="330" cy="520" r="10" fill="#ffffff" stroke="url(#optGrad)" stroke-width="5" filter="url(#glow)" />
    <!-- Node 2: Peak Efficiency Peak -->
    <circle cx="400" cy="430" r="14" fill="url(#optGrad)" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
    <!-- Node 3: Stabilized Point -->
    <circle cx="480" cy="470" r="10" fill="#ffffff" stroke="url(#optGrad)" stroke-width="5" filter="url(#glow)" />
    <!-- Node 4: Future Prediction Target -->
    <circle cx="450" cy="340" r="8" fill="#00f2fe" stroke="#ffffff" stroke-width="2" />

    <!-- 3. Eco-Efficiency Integration (Leaf Cutout on Left) -->
    <path d="M 245,460 
             C 260,390 320,370 350,390
             C 320,420 275,425 245,460 Z" 
          fill="url(#optGrad)" opacity="0.9" filter="url(#shadow)" />
  </g>
</svg>
